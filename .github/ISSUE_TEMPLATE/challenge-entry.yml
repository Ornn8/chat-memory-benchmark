name: 参赛报名 / 提交冻结版本
description: 记忆系统挑战赛 2.2：报名、申请一次开发集试跑、或在冻结日前提交冻结版本
title: "[挑战赛 2.2] 系统名称"
body:
  - type: markdown
    attributes:
      value: |
        规则见 [benchmark-2.2/RULES.md](../blob/main/benchmark-2.2/RULES.md)。**这个表单是公开的**：不要填密钥、手机号、邮箱或任何个人隐私；联系方式写 GitHub 账号就够；报名后请加 QQ 群 1132194746，在群里交押金、联系我们；不要把收款信息写在这里。
        **费用**：测试费用由参赛者自付。每次运行（开发集试跑、封存跑）之前先交 ¥50 押金，我们按公布的价目表结算这次运行的实际费用（你的系统 + 答题 + 判分），多退；总费用到 ¥50 就停止、成绩作废、不补交。
        时间（北京时间）：调试期 2026-11-12 至 2026-12-02；**冻结 2026-12-03 00:00**，之前提交冻结的 commit / tag 和模型清单；封存跑 2026-12-03 至 12-09，只跑一次；复核与公布目标 2026-12-12。
  - type: dropdown
    id: kind
    attributes:
      label: 这次要做什么
      options:
        - 报名
        - 申请一次开发集试跑（调试期内，每队一次）
        - 提交冻结版本（2026-12-03 00:00 之前）
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: 系统名称
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: 开源仓库地址
      description: 公开可访问的仓库 URL
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: 许可证
      description: 需要宽松许可证（MIT / Apache-2.0 / BSD 等）
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: commit 或 tag
      description: 申请试跑时填当前要跑的版本；提交冻结版本时填冻结的 commit / tag（冻结后不能改）
    validations:
      required: true
  - type: textarea
    id: models
    attributes:
      label: 用到的模型清单
      description: 对话模型、向量模型、重排模型（含本地模型）；所有调用都要走评测网关。写模型名即可。
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: 联系方式
      description: 你的 GitHub 账号或本 issue 里回复即可；不需要任何个人信息
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我读过 RULES.md，系统开源在上面的固定 commit / tag 上，使用宽松许可证
          required: true
        - label: 所有模型调用都会走评测网关，不自带密钥直连供应商
          required: true
        - label: 我知道每次运行先交 ¥50 押金、按实际费用多退，总费用超过 ¥50 就停止、成绩作废、押金不退也不再多收
          required: true
        - label: 系统里没有针对 M01 / M02 两个人物的专用数据、专用提示词或写死的人名事实
          required: true
