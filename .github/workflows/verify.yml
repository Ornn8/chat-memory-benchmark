name: Verify public demo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      # The 2.1 / 2.2 harness tests import numpy; without it the ubuntu job fails at test discovery.
      - name: Install harness test dependency
        run: python -m pip install --disable-pip-version-check --quiet numpy
      - name: Validate exam input boundaries
        run: python demo/read_exam.py --verify-all
      - name: Check dataset integrity and isolation
        run: python -m unittest discover -s tests -v
